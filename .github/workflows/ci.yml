name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-32-characters-long
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:5173
  DATABASE_URL: postgres://ci:ci@localhost:5432/halo_ci
  PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  checks:
    name: Quality, types, and build
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - run: bun run build
