name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-32-characters-long
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:5173
  DATABASE_URL: postgres://ci:ci@localhost:5432/halo_ci
  PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  checks:
    name: Quality, types, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - run: bun run build

  tests:
    name: Authentication and access tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: halo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db db:push
      - run: bun run test
